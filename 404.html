<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!--
      Política de seguridad de contenidos.

      Va en una etiqueta y no en una cabecera HTTP porque GitHub Pages no
      deja poner cabeceras. Es una limitación real y conviene tenerla
      escrita: `frame-ancestors` y `report-uri` SE IGNORAN en meta, así que
      esto no protege contra que alguien meta la app en un iframe. Para eso
      haría falta un alojamiento que sirva cabeceras (Cloudflare Pages,
      Netlify) sin cambiar nada más del proyecto.

      Mientras tanto, el iframe lo tapa `src/lib/marco.js` desde
      JavaScript: la app salta fuera del marco y, si el marco no la deja
      salir, NO SE MONTA. Es peor que una cabecera —depende de que corra
      JS— pero es lo único disponible aquí, y deja el formulario de entrada
      y el panel parental fuera del alcance de un clickjacking.

      Lo que sí protege, y es lo que importa aquí: la sesión de Supabase
      vive en `localStorage`, así que un XSS se llevaría la cuenta entera
      del gremio. Sin `script-src` no hay nada que impida a un script
      inyectado ejecutarse ni mandarse los datos a donde quiera.

      El build no genera ni un script en línea, por eso `script-src` puede
      ir sin `unsafe-inline`, que es lo que hace que esto valga de algo.
      `style-src` sí lo necesita: React escribe estilos como atributo y
      Turnstile inyecta los suyos.

      Los dominios son exactamente los cinco que usa la app: ella misma,
      Supabase (datos y realtime), Google Fonts, Cloudflare Turnstile y
      PostHog (región EU, solo dos eventos agregados — legal/privacidad.html
      §2). El comodín en supabase.co es a propósito, para que esto siga
      valiendo si algún día cambia el proyecto de Supabase. El host de
      PostHog va exacto y no en comodín porque `*.posthog.com` colaría
      también `app.posthog.com`, que no es el que usa esta app.
    -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' https://challenges.cloudflare.com;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' data: blob:;
      connect-src 'self' https://*.supabase.co wss://*.supabase.co https://challenges.cloudflare.com https://eu.i.posthog.com;
      frame-src https://challenges.cloudflare.com;
      worker-src 'self';
      manifest-src 'self';
      base-uri 'self';
      form-action 'self';
      object-src 'none'
    " />
    <!-- Que una dirección de recuperación no viaje entera al salir del sitio. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#141428" />
    <meta name="description" content="Misiones, XP, monedas y premios reales para toda la familia." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="El Gremio" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <!-- Dos cosas que hay que saber antes de tocar esto, y que costaron
         dos intentos:

         1. PNG y no SVG: iOS NO admite SVG en apple-touch-icon.
         2. El fichero tiene que existir además en /apple-touch-icon.png y
            en /apple-touch-icon-precomposed.png. iOS sondea esas rutas ÉL
            SOLO, sin leer estas etiquetas, y el rewrite catch-all de
            vercel.json le devolvía index.html con un 200. iOS daba el 200
            por bueno, no podía decodificarlo y pintaba una letra «E» en
            vez del emblema. En Vercel el fichero estático gana al
            rewrite, así que con el fichero puesto el sondeo acierta. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Baloo+2:wght@500;600;700&display=swap" rel="stylesheet" />
    <title>El Gremio</title>
    <script type="module" crossorigin src="/assets/index-BruwWAx7.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BcTdqASR.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
